<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dark Sheets 設定</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="panel">
      <header class="header">
        <img class="logo" src="../icons/icon48.png" alt="" width="32" height="32" />
        <div>
          <h1>Dark Sheets</h1>
          <p class="sub">Google スプレッドシートをダークに</p>
        </div>
        <span id="status-dot" class="status-dot" title="現在の状態"></span>
      </header>

      <section class="group">
        <h2>テーマ</h2>
        <div class="segmented" role="radiogroup" aria-label="テーマ" data-name="mode">
          <button type="button" id="mode-on" data-value="on" role="radio">
            <span class="ico">🌙</span>ダーク
          </button>
          <button type="button" id="mode-off" data-value="off" role="radio">
            <span class="ico">☀️</span>ライト
          </button>
          <button type="button" id="mode-auto" data-value="auto" role="radio">
            <span class="ico">💻</span>OS に従う
          </button>
        </div>
      </section>

      <section class="group">
        <h2>カラーテーマ <span id="theme-name" class="theme-name"></span></h2>
        <div id="theme-grid" class="theme-grid" role="radiogroup" aria-label="カラーテーマ"></div>
      </section>

      <section class="group">
        <h2>調整</h2>
        <label class="slider" for="brightness">
          <span class="label-row"><span>明るさ</span><output id="brightness-out"></output></span>
          <input id="brightness" type="range" min="60" max="140" step="1" />
        </label>
        <label class="slider" for="contrast">
          <span class="label-row"><span>コントラスト</span><output id="contrast-out"></output></span>
          <input id="contrast" type="range" min="60" max="140" step="1" />
        </label>
      </section>

      <footer class="footer">
        <button type="button" id="reset" class="ghost">初期値に戻す</button>
      </footer>
    </main>
    <script src="../settings.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
